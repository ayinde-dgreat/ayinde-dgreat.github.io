<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name – Developer</title>
  <meta name="description" content="Portfolio of Your Name, software developer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #e9edf1;
      --surface: #f7f9fb;
      --ink: #16213a;
      --muted: #566178;
      --line: #c9d1dc;
      --accent: #2a4fff;
      --accent-ink: #fff;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'Instrument Sans', system-ui, sans-serif;
    }

    :root[data-theme="dark"] {
      --bg: #10151f;
      --surface: #182030;
      --ink: #e8edf6;
      --muted: #97a3ba;
      --line: #2a3550;
      --accent: #7f98ff;
      --accent-ink: #10151f;
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 1.0625rem/1.6 var(--body);
      transition: background .3s, color .3s
    }

    a {
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px
    }

    .wrap {
      max-width: 62rem;
      margin: 0 auto;
      padding: 0 1.5rem
    }

    /* nav */
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line)
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      height: 3.5rem
    }

    nav .brand {
      font: 700 1.1rem var(--display);
      text-decoration: none;
      margin-right: auto
    }

    nav a.link {
      text-decoration: none;
      color: var(--muted)
    }

    nav a.link:hover {
      color: var(--ink)
    }

    #theme {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 2rem;
      padding: .3rem .9rem;
      font: inherit;
      font-size: .9rem;
      cursor: pointer
    }

    @media(max-width:560px) {
      nav a.link {
        display: none
      }
    }

    /* hero */
    .hero {
      padding: clamp(3rem, 10vw, 7rem) 0 clamp(2rem, 6vw, 4rem)
    }

    #name {
      font-family: var(--display);
      font-size: clamp(3.2rem, 13vw, 9.5rem);
      line-height: .95;
      letter-spacing: -.03em;
      font-variation-settings: 'wdth' 100;
      cursor: default;
      user-select: none
    }

    #name span {
      display: inline-block;
      font-weight: 300;
      transition: font-weight .12s linear
    }

    #name .sp {
      width: .25em
    }

    .hero p.lead {
      max-width: 34rem;
      margin-top: 1.75rem;
      font-size: 1.25rem;
      color: var(--muted)
    }

    .hero p.hint {
      margin-top: .75rem;
      font-size: .85rem;
      color: var(--muted)
    }

    .cta {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 2rem
    }

    .btn {
      display: inline-block;
      padding: .7rem 1.3rem;
      border-radius: .5rem;
      border: 1px solid var(--ink);
      text-decoration: none;
      font-weight: 600;
      transition: transform .15s
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .btn.main {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink)
    }

    /* sections */
    section {
      padding: clamp(2.5rem, 7vw, 5rem) 0;
      border-top: 1px solid var(--line)
    }

    h2 {
      font: 700 clamp(1.8rem, 4vw, 2.6rem)/1.1 var(--display);
      letter-spacing: -.02em;
      margin-bottom: 1.5rem
    }

    /* projects */
    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1.5rem
    }

    .chip {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 2rem;
      padding: .3rem .9rem;
      font: inherit;
      font-size: .9rem;
      cursor: pointer
    }

    .chip[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    #projects {
      list-style: none;
      padding: 0;
      border-top: 1px solid var(--line)
    }

    .proj {
      border-bottom: 1px solid var(--line)
    }

    .proj>button {
      all: unset;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: baseline;
      width: 100%;
      padding: 1.1rem .25rem;
      cursor: pointer
    }

    .proj>button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: -3px
    }

    .proj h3 {
      font: 600 clamp(1.3rem, 3vw, 1.8rem) var(--display);
      letter-spacing: -.01em;
      transition: font-weight .2s, padding .2s
    }

    .proj>button:hover h3 {
      font-weight: 800;
      padding-left: .4rem
    }

    .proj .yr {
      color: var(--muted);
      font-size: .95rem
    }

    .panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .3s ease
    }

    .proj.open .panel {
      grid-template-rows: 1fr
    }

    .panel>div {
      overflow: hidden
    }

    .panel .inner {
      padding: 0 .25rem 1.4rem;
      max-width: 42rem
    }

    .panel p {
      margin-bottom: .9rem
    }

    .tags {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem
    }

    .tags span {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: .3rem;
      padding: .1rem .55rem;
      font-size: .85rem;
      color: var(--muted)
    }

    .panel a {
      font-weight: 600;
      margin-right: 1rem
    }

    .empty {
      padding: 1.5rem 0;
      color: var(--muted)
    }

    /* about / skills */
    .about {
      display: grid;
      gap: 2.5rem;
      grid-template-columns: 1.2fr 1fr
    }

    @media(max-width:760px) {
      .about {
        grid-template-columns: 1fr
      }
    }

    .about p+p {
      margin-top: 1rem
    }

    #skills {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      list-style: none;
      padding: 0
    }

    #skills li {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: .4rem;
      padding: .35rem .8rem;
      cursor: default;
      transition: background .15s, color .15s
    }

    #skills li:hover {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent)
    }

    /* contact */
    #contact a.big {
      font: 700 clamp(1.5rem, 5vw, 3.2rem) var(--display);
      letter-spacing: -.02em;
      word-break: break-all
    }

    .socials {
      display: flex;
      gap: 1.25rem;
      margin-top: 1.5rem;
      flex-wrap: wrap
    }

    footer {
      padding: 2rem 0;
      color: var(--muted);
      font-size: .9rem;
      border-top: 1px solid var(--line)
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="wrap">
      <nav aria-label="Main">
        <a class="brand" href="#top" id="brand"></a>
        <a class="link" href="#work">Work</a>
        <a class="link" href="#about">About</a>
        <a class="link" href="#contact">Contact</a>
        <button id="theme" type="button" aria-label="Toggle dark mode">Dark</button>
      </nav>
    </div>
  </header>

  <main id="top">
    <div class="wrap hero">
      <h1 id="name" aria-label=""></h1>
      <p class="lead" id="tagline"></p>
      <p class="hint">Move your cursor (or finger) across the name.</p>
      <div class="cta">
        <a class="btn main" href="#work">See my work</a>
        <a class="btn" href="#contact">Get in touch</a>
      </div>
    </div>

    <section id="work">
      <div class="wrap">
        <h2>Selected work</h2>
        <div id="filters" role="group" aria-label="Filter projects by tag"></div>
        <ul id="projects"></ul>
      </div>
    </section>

    <section id="about">
      <div class="wrap about">
        <div>
          <h2>About</h2>
          <div id="bio"></div>
        </div>
        <div>
          <h2>Tools I use</h2>
          <ul id="skills"></ul>
        </div>
      </div>
    </section>

    <section id="contact">
      <div class="wrap">
        <h2>Say hello</h2>
        <a class="big" id="email" href="#"></a>
        <div class="socials" id="socials"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">© <span id="yr"></span> <span id="foot-name"></span>. Built with plain HTML, CSS and JS.</div>
  </footer>

  <script>
    /* ============ EDIT THIS BLOCK ============ */
    const PROFILE = {
      name: "Your Name",
      tagline: "I build fast, accessible web apps and the tools behind them.",
      email: "you@example.com",
      bio: [
        "I'm a developer based in Lagos. I like turning messy problems into small, dependable software.",
        "Outside of work I contribute to open source and tinker with side projects."
      ],
      skills: ["JavaScript", "TypeScript", "React", "Node.js", "Python", "PostgreSQL", "Git", "Figma"],
      socials: [
        { label: "GitHub", url: "https://github.com/your-username" },
        { label: "LinkedIn", url: "https://linkedin.com/in/your-username" }
      ],
      // Set to your GitHub username to also list your top starred repos. Leave "" to disable.
      githubUser: ""
    };

    const PROJECTS = [
      {
        title: "Project One", year: 2026, tags: ["Web", "React"],
        description: "A short description of what it does, who it is for and what you learned.",
        stack: ["React", "Vite", "Node.js"], live: "#", code: "#"
      },
      {
        title: "Project Two", year: 2025, tags: ["CLI", "Python"],
        description: "Explain the problem you solved and the result, ideally with a number.",
        stack: ["Python", "SQLite"], code: "#"
      },
      {
        title: "Project Three", year: 2024, tags: ["Web", "Design"],
        description: "Another project. Delete or duplicate these objects freely.",
        stack: ["HTML", "CSS", "JavaScript"], live: "#"
      }
    ];
    /* ========================================= */

    const $ = s => document.querySelector(s);
    const el = (tag, attrs = {}, kids = []) => {
      const n = Object.assign(document.createElement(tag), attrs);
      [].concat(kids).forEach(k => n.append(k));
      return n;
    };

    /* basic content */
    document.title = `${PROFILE.name} – Developer`;
    $('#brand').textContent = PROFILE.name;
    $('#foot-name').textContent = PROFILE.name;
    $('#tagline').textContent = PROFILE.tagline;
    $('#yr').textContent = new Date().getFullYear();
    PROFILE.bio.forEach(t => $('#bio').append(el('p', { textContent: t })));
    PROFILE.skills.forEach(s => $('#skills').append(el('li', { textContent: s })));
    $('#email').textContent = PROFILE.email;
    $('#email').href = 'mailto:' + PROFILE.email;
    PROFILE.socials.forEach(s => $('#socials').append(
      el('a', { href: s.url, textContent: s.label, target: '_blank', rel: 'noopener' })));

    /* theme: saved choice, else system preference */
    const root = document.documentElement, themeBtn = $('#theme');
    function setTheme(t) {
      root.dataset.theme = t;
      themeBtn.textContent = t === 'dark' ? 'Light' : 'Dark';
      try { localStorage.setItem('theme', t); } catch (e) { }
    }
    let saved = null; try { saved = localStorage.getItem('theme'); } catch (e) { }
    setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    themeBtn.onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

    /* hero: letters get heavier near the pointer */
    const nameEl = $('#name');
    nameEl.setAttribute('aria-label', PROFILE.name);
    const letters = [...PROFILE.name].map(ch => {
      const s = el('span', { textContent: ch === ' ' ? '\u00a0' : ch });
      s.setAttribute('aria-hidden', 'true');
      if (ch === ' ') s.className = 'sp';
      nameEl.append(s);
      return s;
    });
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function weigh(x, y) {
      letters.forEach(l => {
        const r = l.getBoundingClientRect();
        const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
        l.style.fontWeight = Math.round(300 + 500 * Math.max(0, 1 - d / 220));
      });
    }
    if (!reduce) {
      addEventListener('pointermove', e => weigh(e.clientX, e.clientY));
      addEventListener('touchmove', e => weigh(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      /* one intro sweep on load */
      const t0 = performance.now();
      (function sweep(t) {
        const p = (t - t0) / 1400;
        if (p >= 1) return letters.forEach(l => l.style.fontWeight = '');
        const box = nameEl.getBoundingClientRect();
        weigh(box.left + box.width * p, box.top + box.height / 2);
        requestAnimationFrame(sweep);
      })(t0);
    } else letters.forEach(l => l.style.fontWeight = 600);

    /* projects: filter + expand in place */
    let projects = [...PROJECTS], active = 'All';
    const list = $('#projects'), filters = $('#filters');

    function renderFilters() {
      filters.replaceChildren();
      ['All', ...new Set(projects.flatMap(p => p.tags))].forEach(t => {
        const b = el('button', { type: 'button', className: 'chip', textContent: t });
        b.setAttribute('aria-pressed', t === active);
        b.onclick = () => { active = t; renderFilters(); renderProjects(); };
        filters.append(b);
      });
    }
    function renderProjects() {
      list.replaceChildren();
      const shown = projects.filter(p => active === 'All' || p.tags.includes(active));
      if (!shown.length) list.append(el('li', { className: 'empty', textContent: 'No projects with this tag yet.' }));
      shown.forEach((p, i) => {
        const id = 'panel-' + i;
        const head = el('button', { type: 'button' }, [
          el('h3', { textContent: p.title }),
          el('span', { className: 'yr', textContent: p.year })
        ]);
        head.setAttribute('aria-expanded', 'false');
        head.setAttribute('aria-controls', id);
        const links = el('p');
        if (p.live) links.append(el('a', { href: p.live, textContent: 'Live site', target: '_blank', rel: 'noopener' }));
        if (p.code) links.append(el('a', { href: p.code, textContent: 'Source code', target: '_blank', rel: 'noopener' }));
        const panel = el('div', { className: 'panel', id }, el('div', {}, el('div', { className: 'inner' }, [
          el('p', { textContent: p.description }),
          el('div', { className: 'tags' }, (p.stack || []).map(s => el('span', { textContent: s }))),
          links
        ])));
        const li = el('li', { className: 'proj' }, [head, panel]);
        head.onclick = () => {
          const open = li.classList.toggle('open');
          head.setAttribute('aria-expanded', open);
        };
        list.append(li);
      });
    }

    /* optional: pull top starred repos from GitHub */
    async function loadRepos() {
      if (!PROFILE.githubUser) return;
      try {
        const res = await fetch(`https://api.github.com/users/${PROFILE.githubUser}/repos?per_page=100`);
        if (!res.ok) throw new Error(res.status);
        const repos = (await res.json())
          .filter(r => !r.fork && r.description)
          .sort((a, b) => b.stargazers_count - a.stargazers_count)
          .slice(0, 5)
          .map(r => ({
            title: r.name, year: new Date(r.created_at).getFullYear(),
            tags: [r.language || 'Other'], description: r.description,
            stack: r.language ? [r.language] : [], live: r.homepage || '', code: r.html_url
          }));
        projects = [...PROJECTS, ...repos];
        renderFilters(); renderProjects();
      } catch (e) { console.warn('Could not load GitHub repos:', e); }
    }

    renderFilters(); renderProjects(); loadRepos();
  </script>
</body>

</html>
